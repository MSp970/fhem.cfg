# ---- PV-Budget (Schattenmodus, steuert nichts) ------------------------------
# Voraussetzung: 99_PVBudget.pm nach /opt/fhem/FHEM/ kopieren, dann:  reload 99_PVBudget.pm
define PVB dummy
attr PVB room 01 PV
attr PVB group PV_Budget
attr PVB event-on-change-reading ampel,wp_budget_w,grund,tagesbericht
attr PVB stateFormat ampel: ampel | WP-Budget: wp_budget_w W | P10 budget_p10 kWh / P50 budget_p50 kWh

define di_PV_Budget DOIF ([+00:01:00]) ({ PVB_tick() })
attr di_PV_Budget do always
attr di_PV_Budget room 01 PV

define rg_PV_Budget readingsGroup PVB:<Ampel>,ampel PVB:<WP-Budget_W>,wp_budget_w PVB:<Budget_P10_kWh>,budget_p10 PVB:<Budget_P50_kWh>,budget_p50 PVB:<Modus>,modus PVB:<Ziel-SOC_%>,soc_ziel DOIF_GoodWe_v2:<v2_Nacht-Min_SOC>,soc_min_nacht DOIF_GoodWe_v2:<v2_socMax_Lernschritt>,socmax_grund PVB:<Ziel-Hinweis>,soc_ziel_hinweis PVB:<WP_jetzt_W>,wp_ist_w PVB:<WP_P10-Leistung_W>,wp_budget_w_p10 PVB:<WP_P50-Leistung_W>,wp_budget_w_p50 PVB:<WP_Status>,wp_status PVB:<Akku_verf_kWh>,akku_verf_kwh PVB:<Ueberschuss_Rest_P10>,ueberschuss_rest_p10 PVB:<Nacht-Defizit_P10>,nacht_defizit_p10 PVB:<WP_im_Defizitfenster_P10>,wp_fenster_p10 PVB:<WP_Bedarf_Bezugstag>,wp_bezugstag_kwh PVB:<k_live>,k_live PVB:<sigma_PV>,sigma_pv PVB:<Last_Korr>,last_korr PVB:<Grund>,grund PVB:<Tagesbericht>,tagesbericht
attr rg_PV_Budget room 01 PV
attr rg_PV_Budget nonames 1
# Logs: /opt/fhem/log/PV_Budget-JJJJ-MM.csv (5-min + bei Ampelwechsel), PV_Budget_Tag-JJJJ.csv (Tagesbericht)
