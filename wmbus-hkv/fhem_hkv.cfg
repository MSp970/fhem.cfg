# ---- Heizkostenverteiler per wM-Bus (siehe wmbus-hkv/README.md) ----
# Pro HKV eine Kopie dieses Blocks (Name/Topic anpassen).

define HKV_Wohnzimmer MQTT2_DEVICE HKV_Wohnzimmer
attr HKV_Wohnzimmer IODev MQTT_Server
attr HKV_Wohnzimmer room Zaehlerstaende
attr HKV_Wohnzimmer readingList HKV_Wohnzimmer:wmbus/HKV_Wohnzimmer:.* { json2nameValue($EVENT) }
attr HKV_Wohnzimmer event-on-change-reading .*
# Treiberabhängige Feldnamen (qundis: current_consumption_hca); ggf. anpassen
attr HKV_Wohnzimmer userReadings \
  verbrauch_hca:current_consumption_hca.* { my $v=ReadingsVal($name,"current_consumption_hca",undef); my $o=ReadingsVal($name,"verbrauch_hca",0); defined $v && $v>=$o ? $v : $o },\
  tagesstart_hca:current_consumption_hca.* { my $d=strftime("%Y-%m-%d",localtime); my $v=ReadingsVal($name,"verbrauch_hca",0); (ReadingsVal($name,"tag",$d) ne $d || !defined ReadingsVal($name,"tagesstart_hca",undef)) ? do { fhem("setreading $name tag $d"); $v } : ReadingsVal($name,"tagesstart_hca",$v) },\
  tagesverbrauch_hca:verbrauch_hca.* { sprintf("%.0f",ReadingsVal($name,"verbrauch_hca",0)-ReadingsVal($name,"tagesstart_hca",0)) }
attr HKV_Wohnzimmer stateFormat Einheiten: verbrauch_hca | heute: tagesverbrauch_hca | RSSI: rssi_dbm

# Alarm: > 24 h kein Telegramm (Batterie leer / Empfang schlecht)
define wd_HKV_Wohnzimmer watchdog HKV_Wohnzimmer 24:00:00 SAME set wd_HKV_Wohnzimmer addRegexpPart HKV_Wohnzimmer:.* ; setreading HKV_Wohnzimmer alarm kein_Telegramm
attr wd_HKV_Wohnzimmer room Zaehlerstaende

# Summe aller HKV (stündlich)
define HKV_Summe dummy
attr HKV_Summe room Zaehlerstaende
define at_HKV_Summe at +*01:00:00 { my $s=0; $s+=ReadingsVal($_,"verbrauch_hca",0) for devspec2array("TYPE=MQTT2_DEVICE:FILTER=NAME=HKV_.*");; fhem("set HKV_Summe ".sprintf("%.0f",$s)) }
