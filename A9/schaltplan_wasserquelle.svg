<text x="20" y="420" text-anchor="start" fill="#8a2020" font-size="11" font-weight="normal">P1 muss hinter der Zusammenführung auf der Bewässerungsseite sitzen: nur dort misst er bei geschlossenem V6 den Bewässerungsdruck (Bedingung ≥ 1 bar Differenz).</text>
<text x="20" y="436" text-anchor="start" fill="#8a2020" font-size="11" font-weight="normal">P2 sitzt zwischen V7 und V8: bei offenem V7 / geschlossenem V8 zeigt er den Versorgungsdruck. Deshalb öffnet die Logik zweistufig: erst V7, dann V8 bei ΔP ≥ 1 bar.</text>
<text x="20" y="478" text-anchor="start" fill="#222" font-size="13" font-weight="bold">2  Elektrik Messwerterfassung (rot = 24 V, schwarz = GND, grün = Signal, 3,3 V grau)</text>
