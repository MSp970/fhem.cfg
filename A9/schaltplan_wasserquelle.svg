<text x="20" y="418" text-anchor="start" fill="#8a2020" font-size="11" font-weight="normal">P1 sitzt vor V6: bei geschlossenem V6 misst er die Zisternenleitung. Ohne P3 öffnet V6 daher kurz (8 s, Pumpe aus) als Messfenster für den Bewässerungsdruck.</text>
<text x="20" y="434" text-anchor="start" fill="#8a2020" font-size="11" font-weight="normal">Mit P3 (3. Sensor am Sammler) entfällt das Messfenster, und der Rückfluss wird laufend überwacht. V6 und V7/V8 sind nie gleichzeitig offen.</text>
<text x="20" y="478" text-anchor="start" fill="#222" font-size="13" font-weight="bold">2  Elektrik Messwerterfassung (rot = +5 V, schwarz = GND, grün = Signal)</text>
